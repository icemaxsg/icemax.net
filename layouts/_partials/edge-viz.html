{{/* Perimeter instrument: traffic approaches from the open network, is filtered
     at the edge, and only legitimate traffic continues to origin. */}}
<div class="ix-reveal d2">
  <div class="ix-edge-vis">
    <canvas class="ix-edge-canvas" role="img"
      aria-label="{{ i18n "edgeVizAlt" }}"></canvas>
  </div>
  <ul class="ix-edge-legend">
    <li><span class="ix-swatch ix-swatch--threat" aria-hidden="true"></span><span class="ix-label">{{ i18n "legendThreat" }}</span></li>
    <li><span class="ix-swatch ix-swatch--edge" aria-hidden="true"></span><span class="ix-label">{{ i18n "legendEdge" }}</span></li>
    <li><span class="ix-swatch ix-swatch--clean" aria-hidden="true"></span><span class="ix-label">{{ i18n "legendClean" }}</span></li>
  </ul>
</div>
